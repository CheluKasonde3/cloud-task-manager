name: Task Manager CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway database that exists only while this job runs.
    # The password below is a CI-only value and protects nothing real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskmanager_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create tables in the test database
        run: psql "$DATABASE_URL" -f server/db/schema.sql

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

      - name: Smoke test
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1
